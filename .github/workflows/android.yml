name: Build Android APK (base 4.0)

on:
  push:
    branches: [ mm3d-4.0 ]
  # Pull requests into mm3d-4.0 get the same checks and builds, without publishing anything.
  pull_request:
    branches: [ mm3d-4.0 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks before the long builds: the unit tests of the app's install, migration, zip and startup code
  # (plain Java, Android/app/src/test).
  java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Java unit tests
        run: Android/run-java-tests.sh

  # The app copies 2ship.o2r (the port's own ROM-free resources) out of its APK assets on first run,
  # so it is built here on the host the same way main.yml does for the desktop packages.
  port-archive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - name: Apply libultraship patch (MM3D cel shading, colour options and Android)
        run: git -C libultraship apply --ignore-whitespace ../patches/libultraship-mm3d.patch
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
      - name: Install SDL2 and tinyxml2
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          echo "820440072f8f5b50188c1dae104f2ad25984de268785be40c41a099a510f0aec  SDL2-2.30.3.tar.gz" | sha256sum -c -
          tar -xzf SDL2-2.30.3.tar.gz
          (cd SDL2-2.30.3 && ./configure --enable-hidapi-libusb > /dev/null && make -j4 > /dev/null && sudo make install > /dev/null)
          sudo cp -a /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
          sudo apt-get remove -y libtinyxml2-dev
          wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz
          cmake -S tinyxml2-10.0.0 -B tinyxml2-10.0.0/build > /dev/null
          cmake --build tinyxml2-10.0.0/build -j4 > /dev/null
          sudo cmake --install tinyxml2-10.0.0/build > /dev/null
      - name: Generate 2ship.o2r
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr -j4
          ls -la 2ship.o2r
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-2ship-o2r
          path: 2ship.o2r
          retention-days: 3

  apk:
    needs: [ port-archive, java-tests ]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android packages
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "platforms;android-33" "build-tools;34.0.0"

      - name: Apply patches and point Gradle at the runner's CMake
        run: |
          # Renderer (cel shading, outlines, colour options) and the Android parts of LUS: touch controls,
          # phone gyroscope, back button, and the app's own data folder /storage/emulated/0/Majoras Mask Android Definitive Edition.
          git -C libultraship apply --ignore-whitespace ../patches/libultraship-mm3d.patch
          git -C ZAPDTR apply --ignore-whitespace ../patches/zapdtr-android.patch
          cmake --version
          echo "sdk.dir=$ANDROID_HOME" > Android/local.properties
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> Android/local.properties

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-2ship-o2r
          path: Android/app/src/main/assets

      # The opening video (intro-video.yml publishes it from Rafael's own video). Without it the app has no intro.
      - name: Opening video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download intro-video -p abertura.mp4 -D Android/app/src/main/res/raw --clobber \
            && ls -la Android/app/src/main/res/raw || echo "Sem o release intro-video: o APK sai sem a abertura."

      - name: Build debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          # The native code must be an optimized build even in the debug APK (see app/build.gradle).
          grep -h "^CMAKE_BUILD_TYPE" app/.cxx/*/*/arm64-v8a/CMakeCache.txt | tee /dev/stderr | grep -q "=Release"
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "lib/arm64-v8a/|assets/2ship.o2r|assets/assets/Config"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majoras-mask-android-definitive-edition
          path: Android/app/build/outputs/apk/debug/*.apk

      # The release holds only the app; the game data (mm.o2r) is generated on the phone from the user's own ROM.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          short_sha="${GITHUB_SHA::7}"
          tag="android-4.0-build-${GITHUB_RUN_NUMBER}"
          apk="Majoras-Mask-Android-Definitive-Edition-${short_sha}.apk"
          cp Android/app/build/outputs/apk/debug/*.apk "$apk"
          cat > notes.md <<NOTES
          APK do 2Ship MM3D para Android (arm64), agora na base 2Ship 4.0.2: menu novo em português, recursos estilo Majora's Mask 3D, segurar B para acelerar cenas, cel shading com contorno, menu de mods e pacotes de tradução.

          **Como instalar**
          1. Baixe o arquivo \`$apk\` abaixo, em Assets, e instale no celular. Ele atualiza o 2Ship MM3D que você já tem.
          2. Na primeira vez, permita o acesso a todos os arquivos. O app recria os arquivos dele na pasta \`Majoras Mask Android Definitive Edition\` (a pasta antiga \`2S2H-MM3D\` é movida para ela sozinha).
          3. Escolha a sua ROM do Majora's Mask (N64). O app gera de novo o \`mm.o2r\` no próprio celular, porque a base 4.0 usa um formato novo. Os mods e as traduções da pasta continuam lá.

          O menu abre com o botão Back da tela ou com o botão Voltar do Android.

          A ROM e os arquivos do jogo não fazem parte deste download.

          Commit: ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})
          NOTES
          sed -i 's/^          //' notes.md
          # Release creation sometimes gets a transient HTTP 403 from the API, so it is retried a few times.
          for attempt in 1 2 3 4 5; do
            if gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "Majoras Mask Android Definitive Edition - build ${GITHUB_RUN_NUMBER} (${short_sha})" \
              --notes-file notes.md --latest; then
              exit 0
            fi
            echo "Release creation failed (attempt $attempt), retrying in 60s"
            sleep 60
          done
          exit 1

  # The release build (not debuggable), signed with the release key from the repository's secrets when they are
  # set, unsigned otherwise. Kept as a workflow artifact only: the published APK stays the debug-signed one until
  # the signing change in docs/android-assinatura-release.md is decided, so installed copies keep updating.
  apk-release:
    needs: [ port-archive, java-tests ]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android packages
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "platforms;android-33" "build-tools;34.0.0"

      - name: Apply patches and point Gradle at the runner's CMake
        run: |
          git -C libultraship apply --ignore-whitespace ../patches/libultraship-mm3d.patch
          git -C ZAPDTR apply --ignore-whitespace ../patches/zapdtr-android.patch
          echo "sdk.dir=$ANDROID_HOME" > Android/local.properties
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> Android/local.properties

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-2ship-o2r
          path: Android/app/src/main/assets

      - name: Opening video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download intro-video -p abertura.mp4 -D Android/app/src/main/res/raw --clobber \
            || echo "Sem o release intro-video: o APK sai sem a abertura."

      # The secrets only reach this step's environment (GitHub masks them in the log); the keystore is written to
      # the runner's temporary folder and deleted at the end of the job.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MMADE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mmade-release.jks"
            echo "MMADE_RELEASE_STORE_FILE=$RUNNER_TEMP/mmade-release.jks" >> "$GITHUB_ENV"
            echo "Chave release presente: o APK release sai assinado."
          else
            echo "Sem a chave release nos secrets: o APK release sai sem assinatura."
          fi

      - name: Build release APK
        working-directory: Android
        env:
          MMADE_RELEASE_STORE_PASSWORD: ${{ secrets.MMADE_RELEASE_STORE_PASSWORD }}
          MMADE_RELEASE_KEY_ALIAS: ${{ secrets.MMADE_RELEASE_KEY_ALIAS }}
          MMADE_RELEASE_KEY_PASSWORD: ${{ secrets.MMADE_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|assets/2ship.o2r|assets/assets/Config"
          # A distribution build must not be debuggable.
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep "android:debuggable" | grep -q "0xffffffff"; then
            echo "O APK release está debuggable" >&2
            exit 1
          fi
          if [ -n "$MMADE_RELEASE_STORE_FILE" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mmade-release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majoras-mask-android-definitive-edition-release
          path: Android/app/build/outputs/apk/release/*.apk
          retention-days: 14
