def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');

// Release signing comes from outside the repository: environment variables (the CI fills them from GitHub
// Secrets) or ~/.gradle/gradle.properties on a developer's machine. Without them assembleRelease still builds,
// unsigned (app-release-unsigned.apk). The debug key kept in the repository is only for debug builds. See
// docs/android-assinatura-release.md before signing a build for people who already have the app installed.
def releaseSetting = { String env, String prop ->
    def value = System.getenv(env)
    if (value == null || value.isEmpty()) {
        value = project.findProperty(prop)
    }
    return value == null ? "" : value.toString()
}
def releaseStoreFile = releaseSetting("MMADE_RELEASE_STORE_FILE", "mmade.release.storeFile")
def releaseStorePassword = releaseSetting("MMADE_RELEASE_STORE_PASSWORD", "mmade.release.storePassword")
def releaseKeyAlias = releaseSetting("MMADE_RELEASE_KEY_ALIAS", "mmade.release.keyAlias")
def releaseKeyPassword = releaseSetting("MMADE_RELEASE_KEY_PASSWORD", "mmade.release.keyPassword")
def releaseSigningAvailable = !releaseStoreFile.isEmpty() && file(releaseStoreFile).isFile() &&
        !releaseStorePassword.isEmpty() && !releaseKeyAlias.isEmpty() && !releaseKeyPassword.isEmpty()
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    buildFeatures {
        buildConfig true
    }
    ndkVersion "26.0.10792818"
    compileSdkVersion 33
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.mm.mm3d"
            namespace("com.dishii.mm")
        }
        minSdkVersion 24
        targetSdkVersion 33
        // The only place the version is set (AndroidManifest.xml has none). Raising versionCode makes the app make
        // mm.o2r again from the ROM after the update (MainActivity.handleGameArchiveVersion); raise it only when
        // the archive format changes. Any new build already reinstalls the port's own files.
        versionCode 40
        versionName "4.0.2-mm3d.15"
        externalNativeBuild {
            //ndkBuild {
            //    arguments "APP_PLATFORM=android-23"
            //    abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //}
            cmake {
                 arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF", '-DUSE_OPENGLES=ON',
                           "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
                 abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        // A fixed debug key kept in the repository. Without it every CI runner signs with a fresh key, and
        // Android refuses to install a new build over the last one ("conflito com um pacote já existente").
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningAvailable) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // The CI publishes the debug APK, so its native code must still be optimized: at -O0 the
            // on-device ROM extraction (ZAPD) and the game itself run many times slower.
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        // The build for distribution: not debuggable, optimized native code, signed only with the release key.
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigningAvailable ? signingConfigs.release : null
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
            }
        }
       
    }
    lintOptions {
        abortOnError false
    }
    
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // src/test: plain-Java tests of the install, migration and zip checks (also run by Android/run-java-tests.sh).
    testImplementation 'junit:junit:4.13.2'
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.3.2'
}

task prepareKotlinBuildScriptModel {
}
